<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen Bridge — Pair</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  form {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    padding: 24px; text-align: center;
  }
  h1 { font-size: 22px; font-weight: 700; }
  p { font-size: 15px; color: rgba(255,255,255,.6); max-width: 320px; line-height: 1.5; }
  input {
    font-size: 40px; letter-spacing: 12px; text-align: center;
    width: 260px; padding: 16px 0; border-radius: 14px; border: none;
    background: #1c1c1e; color: #fff; font-variant-numeric: tabular-nums;
  }
  input:focus { outline: 2px solid #0a84ff; }
  button {
    font-size: 17px; font-weight: 600; color: #fff; background: #0a84ff;
    border: none; border-radius: 14px; padding: 14px 48px;
  }
  #err { color: #ff453a; font-size: 14px; min-height: 20px; }
</style>
</head>
<body>
<form method="post" action="/pair">
  <h1>Screen Bridge</h1>
  <p id="instruction">Enter the 6-digit code shown on your Mac. / Ingresa el código de 6 dígitos que aparece en tu Mac.</p>
  <p id="hostname" style="font-size: 12px; color: rgba(255,255,255,.4); margin-top: -12px;">screenbridge.local</p>
  <input name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autofocus autocomplete="off">
  <div id="err"></div>
  <button type="submit">Connect</button>
</form>
<script>
  const params = new URLSearchParams(location.search);
  const err = params.get('err');
  const el = document.getElementById('err');
  if (err === 'wrong') el.textContent = 'Wrong code, try again. / Código incorrecto, intenta de nuevo.';
  if (err === 'locked') el.textContent = 'Too many attempts — wait 30 seconds. / Demasiados intentos — espera 30 segundos.';
</script>
</body>
</html>
